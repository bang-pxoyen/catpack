[package]
name = "catpack"
version = "0.2.1"
edition = "2024"
description = "Pack your codebase into a single file for LLM context"
license = "Unlicense"
repository = "https://github.com/bang-pxoyen/catpack"
readme = "README.md"
keywords = ["cli", "llm", "prompt", "context", "codebase"]
categories = ["command-line-utilities", "development-tools"]

include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ignore = "0.4"
walkdir = "2.4"
anyhow = "1.0"
globset = "0.4"
arboard = "3.3"
tiktoken-rs = "0.5"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
